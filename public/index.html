<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Dashboard Platform | Full Stack CRUD</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <!-- Header -->
    <header class="app-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-icon">⚡</div>
          <div>
            <h1>TaskFlow Dashboard</h1>
            <p class="subtitle">Progree Full Stack Development • Task 3</p>
          </div>
        </div>
        <div class="user-badge">
          <span>Mohsin Ali Shah</span>
          <span class="status-indicator"></span>
        </div>
      </div>
    </header>

    <main class="dashboard-main">
      <!-- Metrics Overview -->
      <section class="metrics-grid">
        <div class="metric-card">
          <span class="metric-label">Total Tasks</span>
          <span class="metric-value" id="statTotal">0</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">In Progress</span>
          <span class="metric-value pending" id="statPending">0</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Completed</span>
          <span class="metric-value completed" id="statCompleted">0</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">High Priority</span>
          <span class="metric-value high" id="statHigh">0</span>
        </div>
      </section>

      <!-- Dashboard Controls & Form Grid -->
      <div class="dashboard-grid">
        <!-- Create Task Sidebar/Card -->
        <section class="card form-card">
          <h2 class="card-title">Create New Task</h2>
          <form id="createTaskForm">
            <div class="form-group">
              <label for="taskTitle">Task Title *</label>
              <input type="text" id="taskTitle" placeholder="e.g. Build payment sandbox integration" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="taskPriority">Priority</label>
                <select id="taskPriority">
                  <option value="medium">Medium</option>
                  <option value="high">High</option>
                  <option value="low">Low</option>
                </select>
              </div>
              <div class="form-group">
                <label for="taskCategory">Category</label>
                <input type="text" id="taskCategory" placeholder="Development, Bug, UI..." value="Development">
              </div>
            </div>
            <div class="form-group">
              <label for="taskDesc">Description</label>
              <textarea id="taskDesc" rows="3" placeholder="Additional details or acceptance criteria..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary" id="btnSubmitTask">
              <span>+ Add Task</span>
            </button>
          </form>
        </section>

        <!-- Tasks Feed -->
        <section class="card tasks-card">
          <div class="tasks-toolbar">
            <div class="search-box">
              <input type="text" id="searchInput" placeholder="Search tasks...">
            </div>
            <div class="filter-tabs">
              <button class="filter-btn active" data-filter="all">All</button>
              <button class="filter-btn" data-filter="pending">Pending</button>
              <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
          </div>

          <!-- Task List Container -->
          <div class="tasks-list" id="tasksList">
            <div class="loading-state">Loading tasks...</div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Edit Task Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Task</h3>
        <button class="modal-close" id="closeEditModal">&times;</button>
      </div>
      <form id="editTaskForm">
        <input type="hidden" id="editTaskId">
        <div class="form-group">
          <label for="editTitle">Title</label>
          <input type="text" id="editTitle" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="editPriority">Priority</label>
            <select id="editPriority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="form-group">
            <label for="editCategory">Category</label>
            <input type="text" id="editCategory" required>
          </div>
        </div>
        <div class="form-group">
          <label for="editDesc">Description</label>
          <textarea id="editDesc" rows="3"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="btnCancelEdit">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="app.js"></script>
</body>
</html>
